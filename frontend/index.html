<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PIIShield — PII Anonymisation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0d14;
    --surface:   #111622;
    --surface2:  #161c2d;
    --surface3:  #1c2440;
    --border:    #1e2a45;
    --border2:   #243050;
    --accent:    #3b82f6;
    --accent2:   #6366f1;
    --accent-g:  linear-gradient(135deg,#3b82f6,#6366f1);
    --cyan:      #06b6d4;
    --green:     #10b981;
    --red:       #ef4444;
    --amber:     #f59e0b;
    --text:      #f1f5f9;
    --text2:     #94a3b8;
    --text3:     #475569;
    --font:      'Inter', system-ui, sans-serif;
    --mono:      'JetBrains Mono', monospace;
    --radius:    10px;
    --shadow:    0 4px 24px rgba(0,0,0,0.4);
    --glow:      0 0 20px rgba(59,130,246,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.6; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* Layout */
  .shell { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 240px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .sidebar::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 200px;
    background: radial-gradient(ellipse at top left, rgba(59,130,246,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Logo */
  .logo {
    padding: 22px 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    position: relative;
  }
  .logo-icon {
    width: 38px; height: 38px;
    background: var(--accent-g);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(59,130,246,0.4);
  }
  .logo-icon svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .logo-text { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
  .logo-sub  { font-size: 10px; color: var(--text3); letter-spacing: .8px; text-transform: uppercase; margin-top: 1px; }

  /* Nav */
  nav { padding: 14px 10px; flex: 1; }
  .nav-section { font-size: 9px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; padding: 0 10px; margin: 16px 0 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px;
    cursor: pointer; color: var(--text2);
    font-size: 13px; font-weight: 500;
    transition: all .15s; margin-bottom: 2px;
    position: relative;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active {
    background: rgba(59,130,246,0.12);
    color: var(--accent);
    border: 1px solid rgba(59,130,246,0.2);
  }
  .nav-item.active::before {
    content: '';
    position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px;
    background: var(--accent-g);
    border-radius: 0 3px 3px 0;
  }
  .nav-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Chain status */
  .chain-status {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    background: rgba(16,185,129,0.04);
  }
  .chain-label { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(10px);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .page-badge {
    font-size: 11px; font-weight: 600; color: var(--accent);
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 6px; padding: 2px 8px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 12px 5px 7px; font-size: 12px; color: var(--text2);
  }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-g);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
  }
  .btn-hub {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px;
    font-size: 12px; color: var(--text2); cursor: pointer; font-family: var(--font);
    transition: all .15s;
  }
  .btn-hub:hover { border-color: var(--accent); color: var(--accent); }
  .content { flex: 1; padding: 28px 32px; overflow-y: auto; }

  /* Stat row */
  .stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    position: relative; overflow: hidden;
    transition: border-color .2s, transform .2s;
  }
  .stat-card:hover { border-color: var(--border2); transform: translateY(-2px); }
  .stat-card::after {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--accent-g);
    opacity: 0; transition: opacity .2s;
  }
  .stat-card:hover::after { opacity: 1; }
  .stat-icon {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .stat-icon svg { width: 16px; height: 16px; fill: none; stroke-width: 2; stroke-linecap: round; }
  .si-blue   { background: rgba(59,130,246,0.12); }
  .si-blue svg { stroke: var(--accent); }
  .si-green  { background: rgba(16,185,129,0.12); }
  .si-green svg { stroke: var(--green); }
  .si-red    { background: rgba(239,68,68,0.12); }
  .si-red svg { stroke: var(--red); }
  .si-cyan   { background: rgba(6,182,212,0.12); }
  .si-cyan svg { stroke: var(--cyan); }
  .stat-value { font-size: 30px; font-weight: 700; font-family: var(--mono); color: var(--text); letter-spacing: -1px; }
  .stat-label { font-size: 12px; color: var(--text2); margin-top: 3px; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px;
  }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .card-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .8px; }

  /* Table */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; padding: 9px 14px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; background: var(--surface2); }
  .tbl td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text2); }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr:hover td { background: var(--surface2); color: var(--text); }

  /* Badges */
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 10px; font-weight: 600; letter-spacing: .3px; background: rgba(59,130,246,0.12); color: var(--accent); border: 1px solid rgba(59,130,246,0.2); }
  .badge-method { background: rgba(16,185,129,0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
  .badge-warn   { background: rgba(245,158,11,0.1); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }

  /* Status */
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-completed  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-detected   { background: var(--amber); }
  .status-failed     { background: var(--red); }
  .status-uploaded   { background: var(--accent); }
  .status-processing { background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; font-family: var(--font); transition: all .15s; }
  .btn-primary { background: var(--accent-g); color: #fff; box-shadow: 0 0 16px rgba(59,130,246,0.25); }
  .btn-primary:hover { filter: brightness(1.1); box-shadow: 0 0 24px rgba(59,130,246,0.4); transform: translateY(-1px); }
  .btn-secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: not-allowed; filter: none; transform: none; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-danger { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }

  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--border2);
    border-radius: var(--radius); padding: 56px 24px;
    text-align: center; cursor: pointer; transition: all .2s;
    background: var(--surface2);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(59,130,246,0.05);
    box-shadow: var(--glow);
  }
  .drop-zone-icon { margin-bottom: 16px; color: var(--text3); }
  .drop-zone-icon svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .drop-zone h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .drop-zone p { color: var(--text2); font-size: 13px; }
  #file-input { display: none; }

  /* Steps */
  .steps { display: flex; align-items: center; margin-bottom: 28px; }
  .step { display: flex; align-items: center; gap: 8px; }
  .step-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; border: 2px solid var(--border2); color: var(--text3); flex-shrink: 0; }
  .step.active .step-num { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.1); }
  .step.done .step-num { background: var(--accent-g); border-color: transparent; color: #fff; box-shadow: 0 0 10px rgba(59,130,246,0.4); }
  .step-label { font-size: 12px; font-weight: 500; color: var(--text3); }
  .step.active .step-label, .step.done .step-label { color: var(--text); }
  .step-line { flex: 1; height: 1px; background: var(--border); margin: 0 12px; }
  .step.done + .step-line { background: var(--accent); opacity: .4; }

  /* Blocks */
  .block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 8px;
    display: flex; align-items: flex-start; gap: 14px;
    transition: border-color .15s;
  }
  .block:hover { border-color: var(--border2); }
  .block-index {
    font-family: var(--mono); font-size: 10px;
    color: var(--accent); background: rgba(59,130,246,0.1);
    border-radius: 4px; padding: 2px 7px; flex-shrink: 0; margin-top: 2px;
    border: 1px solid rgba(59,130,246,0.2);
  }
  .block-action { font-weight: 600; font-size: 13px; color: var(--text); }
  .block-hash { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-top: 4px; word-break: break-all; }
  .block-time { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* Technique row */
  .technique-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .technique-row:last-child { border-bottom: none; }
  select {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 6px; color: var(--text); padding: 6px 10px;
    font-size: 13px; font-family: var(--font); outline: none; transition: border-color .15s;
  }
  select:focus { border-color: var(--accent); }

  /* Info banner */
  .info-banner {
    background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(99,102,241,0.06));
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: var(--radius); padding: 16px 20px;
    display: flex; align-items: center; gap: 14px;
  }

  /* Chain valid/invalid */
  .chain-valid   { color: var(--green); font-weight: 600; }
  .chain-invalid { color: var(--red); font-weight: 600; }

  /* Toast */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--text);
    max-width: 320px; animation: slideIn .2s ease; box-shadow: var(--shadow);
  }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error   { border-left: 3px solid var(--red); }
  .toast.info    { border-left: 3px solid var(--accent); }
  @keyframes slideIn { from{transform:translateX(40px);opacity:0} to{transform:none;opacity:1} }

  /* Loader */
  .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* Misc */
  .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-icon { margin-bottom: 14px; }
  .empty-icon svg { width: 40px; height: 40px; fill: none; stroke: var(--border2); stroke-width: 1.5; }
  .empty h3 { font-size: 15px; color: var(--text2); margin-bottom: 6px; }
  .text-muted { color: var(--text2); }
  .text-accent { color: var(--accent); }
  .font-mono { font-family: var(--mono); font-size: 12px; }
  .flex { display: flex; }
  .gap-2 { gap: 8px; }
  .mt-2 { margin-top: 8px; }
  .mt-4 { margin-top: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style>
</head>
<body>

<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V6L12 2z"/></svg>
      </div>
      <div>
        <div class="logo-text">PIIShield</div>
        <div class="logo-sub">Privacy Compliance</div>
      </div>
    </div>

    <nav>
      <div class="nav-section">Main</div>
      <div class="nav-item active" onclick="navigate('dashboard')" id="nav-dashboard">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
        Dashboard
      </div>
      <div class="nav-item" onclick="navigate('upload')" id="nav-upload">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
        Upload Dataset
      </div>
      <div class="nav-item" onclick="navigate('datasets')" id="nav-datasets">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg></span>
        Datasets
      </div>

      <div class="nav-section">Security</div>
      <div class="nav-item" onclick="navigate('audit')" id="nav-audit">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></span>
        Audit Chain
      </div>
    </nav>

    <div class="chain-status">
      <div class="chain-label">Blockchain Status</div>
      <div id="chain-status-sidebar" style="font-size:12px;color:var(--text2)">Verifying...</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div id="page-title" style="font-size:15px;font-weight:600;color:var(--text)">Dashboard</div>
        <span class="page-badge" id="page-badge">Overview</span>
      </div>
      <div class="topbar-right">
        <div class="user-chip">
          <div class="avatar" id="avatar">A</div>
          <span id="user-display" style="color:var(--text)">Admin</span>
        </div>
        <button class="btn-hub" onclick="window.location.href='hub.html'">Hub</button>
        <button class="btn-hub" onclick="logout()" style="color:var(--red);border-color:rgba(239,68,68,0.2)">Sign out</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
const API = 'http://172.28.236.73:8000/api';
let currentPage = 'dashboard';
let datasets = [];
let stats = {};

const user = sessionStorage.getItem('piishield_user') || 'Admin';
document.getElementById('user-display').textContent = user;
document.getElementById('avatar').textContent = user.charAt(0).toUpperCase();

function logout() { sessionStorage.clear();  }

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function api(path, opts={}) {
  opts.headers = opts.headers || {};
  
  // Update 'piishield_token' if your login script uses a different key name!
  const token = sessionStorage.getItem('piishield_token'); 
  if (token) {
    opts.headers['X-API-Key'] = token;
  }

  try {
    const res = await fetch(API + path, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({detail: res.statusText}));
      throw new Error(err.detail || res.statusText);
    }
    return res.json();
  } catch(e) {
    toast('API error: ' + e.message, 'error');
    throw e;
  }
}

const PAGE_LABELS = {dashboard:'Overview', upload:'New Dataset', datasets:'All Datasets', audit:'Blockchain', process:'Processing'};

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-' + page)?.classList.add('active');
  document.getElementById('page-title').textContent =
    {dashboard:'Dashboard', upload:'Upload Dataset', datasets:'Datasets', audit:'Audit Chain', process:'Process Dataset'}[page] || page;
  document.getElementById('page-badge').textContent = PAGE_LABELS[page] || page;
  render();
}

function fmtDate(d) { return d ? new Date(d).toLocaleString() : '—'; }

async function render() {
  const el = document.getElementById('content');
  if (currentPage === 'dashboard') el.innerHTML = await renderDashboard();
  if (currentPage === 'upload')    el.innerHTML = renderUpload();
  if (currentPage === 'datasets')  el.innerHTML = await renderDatasets();
  if (currentPage === 'audit')     el.innerHTML = await renderAudit();
  if (currentPage === 'process')   el.innerHTML = await renderProcess(window._processId);
  attachHandlers();
}

async function renderDashboard() {
  try { stats = await api('/stats'); datasets = await api('/datasets'); } catch { stats = {}; datasets = []; }
  return `
  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-icon si-blue"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg></div>
      <div class="stat-value">${stats.total_datasets ?? 0}</div>
      <div class="stat-label">Datasets uploaded</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon si-green"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="stat-value">${stats.completed ?? 0}</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon si-red"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <div class="stat-value">${stats.total_pii_detections ?? 0}</div>
      <div class="stat-label">PII fields detected</div>
    </div>
    <div class="stat-card">

async function renderAudit() {
  // Read all blocks directly from the Fabric bridge
  try {
    const res = await fetch('http://localhost:4000/blocks');
    const chain = await res.json();
    const v = await api('/audit/verify');
    return `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:16px;background:var(--surface);border-radius:8px;border:1px solid var(--border)">
        <div style="width:36px;height:36px;border-radius:50%;background:${v.valid?'#22c55e22':'#ef444422'};display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" fill="none" stroke="${v.valid?'#22c55e':'#ef4444'}" stroke-width="2" style="width:18px;height:18px"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
        </div>
        <div>
          <div style="font-weight:700;color:${v.valid?'#22c55e':'#ef4444'}">${v.valid?'All '+v.total_blocks+' blocks verified — tamper-proof':'Chain integrity failed'}</div>
          <div style="font-size:12px;color:var(--text2)">Hyperledger Fabric · SHA-256 hash chain</div>
        </div>
      </div>
      <div class="card-header" style="margin-bottom:16px">
        <div class="card-title">Blockchain Audit Log (${chain.length} blocks)</div>
      </div>
      ${chain.slice().reverse().map(b=>`
        <div class="block" style="margin-bottom:12px;padding:14px;background:var(--surface);border-radius:8px;border:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="font-weight:700;color:var(--text3);font-size:12px;min-width:32px">#${b.index}</div>
            <div style="flex:1">
              <div style="font-weight:600;font-size:13px;color:var(--text)">${b.action} <span style="font-weight:400;color:var(--text3)">· dataset #${b.datasetId}</span>
                ${b.piiType?`<span class="badge" style="margin-left:8px">${b.piiType}</span>`:''}
                ${b.anonymisationMethod?`<span class="badge badge-method" style="margin-left:4px">${b.anonymisationMethod}</span>`:''}
                ${b.recordsAffected?`<span style="font-size:11px;color:var(--text3);margin-left:6px">${b.recordsAffected.toLocaleString()} records</span>`:''}
              </div>
              <div style="font-size:11px;color:var(--text3);margin-top:4px;font-family:monospace">${b.blockHash}</div>
              <div style="font-size:11px;color:var(--text3)">prev: ${b.previousHash?.substring(0,32)}...</div>
            </div>
            <div style="font-size:11px;color:var(--text3);white-space:nowrap">${new Date(b.timestamp).toLocaleString()}</div>
          </div>
        </div>`).join('')}
    </div>`;
  } catch(e) {
    // fallback
  }
  // original fallback below
  return `<div class="card"><div class="empty"><h3>Could not load audit chain</h3><p>${e?.message||'Bridge not reachable'}</p></div></div>`;
  // ORIGINAL_AUDIT_START
  let chain = [], verify = {};
  try {
    verify = await api('/audit/verify');
    if (datasets.length === 0) datasets = await api('/datasets').catch(()=>[]);
    for (const d of datasets) {
      const r = await api(`/audit/${d.id}`).catch(()=>({blocks:[]}));
      for (const b of (r.blocks || [])) {
        if (!chain.find(c=>c.index===b.index)) chain.push(b);
      }
    }
    chain.sort((a,b)=>a.index-b.index);
  } catch(e){ console.error('Audit error:', e); }

  return `
  <div class="card" style="margin-bottom:16px;background:${verify.valid ? 'rgba(16,185,129,0.05)' : 'rgba(239,68,68,0.05)'};border-color:${verify.valid ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)'}">
    <div style="display:flex;align-items:center;gap:16px">
      <div style="width:40px;height:40px;border-radius:10px;background:${verify.valid ? 'rgba(16,185,129,0.12)' : 'rgba(239,68,68,0.12)'};display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${verify.valid ? 'var(--green)' : 'var(--red)'}" stroke-width="2" stroke-linecap="round"><path d="M12 2L4 6v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V6L12 2z"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px">Chain integrity</div>
        <div style="font-size:12px">
          ${verify.valid === undefined
            ? `<span style="color:var(--text2)">Connecting...</span>`
            : verify.valid
              ? `<span class="chain-valid">All ${verify.total_blocks} blocks verified — tamper-proof</span>`
              : `<span class="chain-invalid">Broken at block ${verify.broken_at ?? '?'}</span>`}
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="navigate('audit')">Refresh</button>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title">Blockchain audit log (${chain.length} blocks)</div>
    </div>
    ${chain.length === 0
      ? `<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div><h3>No blocks yet</h3><p>Upload and process a dataset.</p></div>`
      : chain.map(b=>`
        <div class="block">
          <div class="block-index">#${b.index}</div>
          <div style="flex:1;min-width:0">
            <div class="block-action">${b.action} <span style="font-weight:400;font-size:12px;color:var(--text2)">&middot; dataset #${b.dataset_id}</span></div>
            ${b.pii_type ? `<div style="margin-top:5px">
              <span class="badge">${b.pii_type}</span>
              ${b.anonymisation_method ? `<span class="badge badge-method" style="margin-left:4px">${b.anonymisation_method}</span>` : ''}
              <span style="font-size:11px;color:var(--text3);margin-left:6px">${b.records_affected} records</span>
            </div>` : ''}
            <div class="block-hash" style="margin-top:5px">${b.block_hash}</div>
            <div class="block-time">prev: ${b.previous_hash?.substring(0,24)}...</div>
          </div>
          <div style="font-size:11px;color:var(--text3);white-space:nowrap">${fmtDate(b.timestamp)}</div>
        </div>`).join('')}
  </div>`;
}

async function renderProcess(id) {
  let result = {}, detections = [], dataset = {};
  try {
    result = await api(`/results/${id}`);
    dataset = result.dataset || {};
    detections = result.detections || [];

  const steps = ['uploaded','detected','completed'];
  const stepIdx = steps.indexOf(dataset.status) > -1 ? steps.indexOf(dataset.status) : 0;

  return `
  <div style="margin-bottom:20px;display:flex;align-items:center;gap:10px">
    <button class="btn btn-secondary btn-sm" onclick="navigate('datasets')">Back</button>
    <span style="font-size:15px;font-weight:600;color:var(--text)">${dataset.filename || 'Dataset #'+id}</span>

      <div class="step-num">${stepIdx>=1?'✓':'2'}</div><div class="step-label">Detect PII</div>
    </div>
    <div class="step-line"></div>

    </div>

    </div>
  </div>

  <div class="flex gap-2" style="margin-bottom:24px">

  ${detections.length === 0
    ? `<div class="card"><div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><h3>No detections yet</h3><p>Click "Run PII detection" above.</p></div></div>`

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">

          </div>
          <table class="tbl">
            <thead><tr><th>Column</th><th>PII Type</th><th>Count</th><th>Method</th></tr></thead>
            <tbody>${detections.map(d=>`
              <tr>
                <td class="font-mono" style="color:#ef4444;font-weight:600">${d.column}</td>

            } columns</span>
          </div>
          <table class="tbl">
            <thead><tr><th>Column</th><th>Status</th></tr></thead>
            <tbody>${

            <select id="tech-${d.column}" style="flex:1;max-width:180px">
              <option value="MASK" ${['NAME','EMAIL','PHONE','ADDRESS','ZIP_CODE','DATE_OF_BIRTH','IP_ADDRESS'].includes(d.pii_type)?'selected':''}>Mask</option>
              <option value="HASH" ${['CREDIT_CARD','AADHAAR','PAN','SSN'].includes(d.pii_type)?'selected':''}>Hash (SHA-256)</option>
              <option value="ENCRYPT">Encrypt (AES-256)</option>
              <option value="TOKENISE">Tokenise</option>
            </select>
          </div>`).join('')}
        <div id="anon-status" class="mt-4"></div>

function attachHandlers() {
  const fi = document.getElementById('file-input');
  const dz = document.getElementById('drop-zone');
  if (fi) fi.onchange = e => handleUpload(e.target.files[0]);
  if (dz) {
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('dragover'); };
    dz.ondragleave = () => dz.classList.remove('dragover');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('dragover'); handleUpload(e.dataTransfer.files[0]); };
  }
}

async function handleUpload(file) {
  if (!file) return;
  const status = document.getElementById('upload-status');
  status.innerHTML = `<div class="flex gap-2"><span class="loader"></span> <span style="color:var(--text2)">Uploading ${file.name}...</span></div>`;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await api('/upload', {method:'POST', body:fd});
    toast(`Uploaded "${r.filename}" (${r.total_rows.toLocaleString()} rows)`, 'success');
    status.innerHTML = `<div style="color:var(--green);font-size:13px">Upload complete &middot; <strong>${r.total_rows.toLocaleString()} rows</strong> &middot; <button class="btn btn-primary btn-sm" onclick="openProcess(${r.id})" style="margin-left:6px">Run detection</button></div>`;
  } catch(e) {
    status.innerHTML = `<div style="color:var(--red)">Upload failed: ${e.message}</div>`;
  }
}

async function runDetect(id) {
  document.getElementById('btn-detect').disabled = true;
  document.getElementById('btn-detect').innerHTML = '<span class="loader"></span> Detecting...';
  try {
    const r = await api(`/detect/${id}`, {method:'POST'});
    toast(`Found ${r.total_pii_cells.toLocaleString()} PII cells in ${Object.keys(r.pii_columns).length} columns`, 'success');
    window._processId = id; render();
  } catch(e) {
    toast('Detection failed: ' + e.message, 'error');
    document.getElementById('btn-detect').disabled = false;
    document.getElementById('btn-detect').textContent = 'Run PII detection';
  }
}

async function runAnonymise(id) {
  const result = await api(`/results/${id}`);
  const overrides = {};
  (result.detections || []).forEach(d => {
    const sel = document.getElementById('tech-' + d.column);
    if (sel) overrides[d.column] = sel.value;
  });
  document.getElementById('btn-anon').disabled = true;
  document.getElementById('btn-anon').innerHTML = '<span class="loader"></span> Anonymising...';
  const statusEl = document.getElementById('anon-status');
  if (statusEl) statusEl.innerHTML = '<span class="loader"></span> <span style="color:var(--text2)">Applying anonymisation...</span>';
  try {
    const r = await api(`/anonymise/${id}`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({technique_overrides: overrides})});
    toast(`Anonymised ${r.summary.reduce((s,x)=>s+x.rows_changed,0).toLocaleString()} values across ${r.summary.length} columns`, 'success');
    window._processId = id; render();
  } catch(e) {
    toast('Anonymisation failed: ' + e.message, 'error');
    document.getElementById('btn-anon').disabled = false;
    document.getElementById('btn-anon').textContent = 'Anonymise';
  }
}

function downloadFile(id) {
  toast('Downloading anonymised file...', 'info');
  window.open(API + `/download/${id}`, '_blank');
}

function openProcess(id) {
  window._processId = id;
  currentPage = 'process';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-title').textContent = 'Process Dataset';
  document.getElementById('page-badge').textContent = 'Processing';
  render();
}

async function init() {
  await render();
  try {
    const v = await api('/audit/verify');
    const el = document.getElementById('chain-status-sidebar');
    if (el) el.innerHTML = v.valid
      ? `<span style="color:var(--green);font-weight:500">Valid &middot; ${v.total_blocks} blocks</span>`
      : `<span style="color:var(--red)">Integrity failed</span>`;
  } catch {}
}

init();
</script>
</body>
</html>
