<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIIShield — Reset Password</title>
<style>
  :root {
    --primary: #90243f;
    --primary-dark: #90243f;
    --accent: #90243f;
    --text-dark: #90243f;
    --text-muted: #90243f;
    --error: #90243f;
    --success: #90243f;
    --border: #e3d136;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffff, #ffff, #ffff);
    background-size: 200% 200%;
    animation: bgShift 12s ease infinite;
    padding: 20px;
    position: relative; overflow: hidden;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(60px); opacity: 0.35; z-index: 0;
    animation: float 8s ease-in-out infinite;
  }
  .blob1 { width: 300px; height: 300px; background: var(--primary); top: -80px; left: -80px; }
  .blob2 { width: 250px; height: 250px; background: var(--accent); bottom: -60px; right: -60px; animation-delay: 2s; }
  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-25px); }
  }
  .card {
    background: #fff; border-radius: 20px;
    padding: 44px 40px; width: 100%; max-width: 400px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    position: relative; z-index: 1;
    animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:none} }
  .logo {
    width: 52px; height: 52px; border-radius: 13px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .logo svg { width: 28px; height: 28px; fill: white; }
  h1 { text-align: center; font-size: 22px; color: var(--text-dark); margin-bottom: 4px; font-weight: 700; }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 28px; text-transform: uppercase; letter-spacing: .5px; }

  .steps-bar { display: flex; align-items: center; margin-bottom: 28px; }
  .step-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--text-muted); flex-shrink: 0; transition: all .3s; }
  .step-dot.active { border-color: var(--primary); color: var(--primary); background: #eff0fe; }
  .step-dot.done { background: var(--primary); border-color: var(--primary); color: white; }
  .step-line { flex: 1; height: 2px; background: var(--border); margin: 0 8px; transition: background .3s; }
  .step-line.done { background: var(--primary); }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dark); margin-bottom: 5px; margin-top: 16px; }
  input, select {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
    transition: border-color .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
  .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .question-box {
    background: #f8fafc; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-size: 13px; color: var(--text-dark);
    margin-top: 16px; font-style: italic;
  }
  button.primary-btn {
    width: 100%; margin-top: 22px; padding: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: transform .15s, box-shadow .15s;
  }
  button.primary-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79,70,229,0.35); }
  button.primary-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .msg { font-size: 12px; margin-top: 12px; text-align: center; min-height: 16px; }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }
  .back-link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
  .back-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
  .step-panel { display: none; }
  .step-panel.active { display: block; }
  .pwd-rules { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.6; }
  .rule { display: flex; align-items: center; gap: 6px; }
  .rule-icon { font-size: 12px; }
  .rule.ok .rule-icon { color: var(--success); }
  .rule.fail .rule-icon { color: #cbd5e1; }
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
  </div>
  <h1>Reset Password</h1>
  <div class="subtitle">Account Recovery</div>

  <!-- Steps bar -->
  <div class="steps-bar">
    <div class="step-dot active" id="dot1">1</div>
    <div class="step-line" id="line1"></div>
    <div class="step-dot" id="dot2">2</div>
    <div class="step-line" id="line2"></div>
    <div class="step-dot" id="dot3">3</div>
  </div>

  <!-- Step 1: Username -->
  <div class="step-panel active" id="panel1">
    <form id="step1Form">
      <label for="fpUsername">Username</label>
      <input type="text" id="fpUsername" placeholder="e.g. acmecorp@piishield" required autocomplete="username">
      <div class="hint">Use the username shown when you registered</div>
      <button type="submit" class="primary-btn">Continue</button>
      <div class="msg error" id="step1Error"></div>
    </form>
  </div>

  <!-- Step 2: Security question -->
  <div class="step-panel" id="panel2">
    <form id="step2Form">
      <div class="question-box" id="questionDisplay"></div>
      <label for="fpAnswer">Your Answer</label>
      <input type="text" id="fpAnswer" required autocomplete="off">
      <div class="hint">Answer is case-insensitive</div>
      <button type="submit" class="primary-btn">Verify Answer</button>
      <div class="msg error" id="step2Error"></div>
    </form>
  </div>

  <!-- Step 3: New password -->
  <div class="step-panel" id="panel3">
    <form id="step3Form">
      <label for="newPwd">New Password</label>
      <input type="password" id="newPwd" required minlength="8" oninput="checkRules(this.value)">
      <div class="pwd-rules" id="pwdRules">
        <div class="rule fail" id="r-len"><span class="rule-icon">●</span> At least 8 characters</div>
        <div class="rule fail" id="r-upper"><span class="rule-icon">●</span> 1 uppercase letter</div>
        <div class="rule fail" id="r-num"><span class="rule-icon">●</span> 1 number</div>
        <div class="rule fail" id="r-special"><span class="rule-icon">●</span> 1 special character</div>
      </div>
      <label for="confirmPwd">Confirm Password</label>
      <input type="password" id="confirmPwd" required>
      <button type="submit" class="primary-btn">Reset Password</button>
      <div class="msg error" id="step3Error"></div>
      <div class="msg success" id="step3Success"></div>
    </form>
  </div>

  <div class="back-link">Remembered it? <a href="login.html">Back to Sign In</a></div>
</div>

<script>
const API = 'http://172.28.236.73:8000/api';
let currentUsername = '';
let resetToken = '';

function goStep(n) {
  document.querySelectorAll('.step-panel').forEach((p,i) => {
    p.classList.toggle('active', i+1 === n);
  });
  [1,2,3].forEach(i => {
    const dot = document.getElementById('dot'+i);
    dot.className = 'step-dot' + (i < n ? ' done' : i === n ? ' active' : '');
    if (i < 3) {
      const line = document.getElementById('line'+i);
      line.className = 'step-line' + (i < n ? ' done' : '');
    }
  });
}

function checkRules(val) {
  const rules = {
    'r-len':     val.length >= 8,
    'r-upper':   /[A-Z]/.test(val),
    'r-num':     /[0-9]/.test(val),
    'r-special': /[!@#$%^&*(),.?":{}|<>_\-+=~`[\]\/\\;']/.test(val),
  };
  for (const [id, ok] of Object.entries(rules)) {
    const el = document.getElementById(id);
    el.className = 'rule ' + (ok ? 'ok' : 'fail');
    el.querySelector('.rule-icon').textContent = ok ? '✓' : '●';
  }
}

// Step 1 — find user by username
document.getElementById('step1Form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const username = document.getElementById('fpUsername').value.trim();
  const errorEl = document.getElementById('step1Error');
  errorEl.textContent = '';
  const btn = this.querySelector('button');
  btn.disabled = true; btn.textContent = 'Looking up...';

  try {
    const res = await fetch(`${API}/auth/forgot-password/question`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.detail || 'Username not found.'; btn.disabled=false; btn.textContent='Continue'; return; }
    currentUsername = username;
    document.getElementById('questionDisplay').textContent = '🔒 ' + data.question;
    goStep(2);
  } catch {
    errorEl.textContent = 'Could not reach the server.';
  }
  btn.disabled=false; btn.textContent='Continue';
});

// Step 2 — verify answer
document.getElementById('step2Form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const answer = document.getElementById('fpAnswer').value.trim();
  const errorEl = document.getElementById('step2Error');
  errorEl.textContent = '';
  const btn = this.querySelector('button');
  btn.disabled=true; btn.textContent='Verifying...';

  try {
    const res = await fetch(`${API}/auth/forgot-password/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUsername, answer })
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.detail || 'Incorrect answer.'; btn.disabled=false; btn.textContent='Verify Answer'; return; }
    resetToken = data.reset_token;
    goStep(3);
  } catch {
    errorEl.textContent = 'Could not reach the server.';
  }
  btn.disabled=false; btn.textContent='Verify Answer';
});

// Step 3 — reset password
document.getElementById('step3Form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const newPwd = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  const errorEl = document.getElementById('step3Error');
  const successEl = document.getElementById('step3Success');
  errorEl.textContent = ''; successEl.textContent = '';

  const strongPwd = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*(),.?":{}|<>_\-+=~`[\]\/\\;'])[^\s]{8,}$/;
  if (!strongPwd.test(newPwd)) { errorEl.textContent = 'Password does not meet the requirements above.'; return; }
  if (newPwd !== confirm) { errorEl.textContent = 'Passwords do not match.'; return; }

  const btn = this.querySelector('button');
  btn.disabled=true; btn.textContent='Resetting...';

  try {
    const res = await fetch(`${API}/auth/forgot-password/reset`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reset_token: resetToken, new_password: newPwd })
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.detail || 'Reset failed.'; btn.disabled=false; btn.textContent='Reset Password'; return; }
    successEl.textContent = 'Password reset successfully! Redirecting to sign in...';
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  } catch {
    errorEl.textContent = 'Could not reach the server.';
  }
  btn.disabled=false; btn.textContent='Reset Password';
});
</script>
</body>
</html>
