<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PIIShield — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --border: #e2e5ea;
    --accent: #90243f; --text: #111827; --text2: #4b5563; --green: #10b981; --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 36px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
  p { font-size: 14.5px; color: var(--text2); margin-bottom: 24px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 16px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 15.5px; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  #message { margin-top: 16px; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h2>Set New Password</h2>
  <p>Enter your new password below for your PIIShield account.</p>
  <form id="reset-form">
    <input type="password" id="new-password" placeholder="New Password" required>
    <button type="submit">Update Password</button>
  </form>
  <div id="message"></div>
</div>

<script>
const API = 'http://172.28.236.73:8000/api';
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

document.getElementById('reset-form').onsubmit = async (e) => {
  e.preventDefault();
  const new_password = document.getElementById('new-password').value;
  const msg = document.getElementById('message');
  
  try {
    const res = await fetch(API + '/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token, new_password})
    });
    const data = await res.json();
    if (res.ok) {
      msg.style.color = 'var(--green)';
      msg.textContent = 'Password reset successful! Redirecting to login...';
      setTimeout(() => window.location.href = 'login.html', 2000);
    } else {
      msg.style.color = 'var(--red)';
      msg.textContent = data.detail || 'Failed to reset password.';
    }
  } catch(err) {
    msg.style.color = 'var(--red)';
    msg.textContent = 'Network error. Please try again.';
  }
};
</script>
</body>
</html>
