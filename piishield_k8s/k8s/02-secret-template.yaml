# Secret for the Fabric bridge's wallet (identity credentials) and the
# connection-org1.json connection profile.
#
# IMPORTANT: this is a TEMPLATE. Never commit real private key material
# into version control or a plain YAML file in a real deployment — in
# production this should be created via `kubectl create secret generic`
# from the actual wallet files, or better, pulled from a proper secrets
# manager (Vault, AWS Secrets Manager, sealed-secrets, etc.).
#
# To generate this for real, after enrollAdmin.js / registerUser.js have
# run locally and produced piishield-bridge/wallet/ and connection-org1.json:
#
#   kubectl create secret generic piishield-fabric-wallet \
#     --namespace piishield \
#     --from-file=connection-org1.json=./piishield-bridge/connection-org1.json \
#     --from-file=admin.id=./piishield-bridge/wallet/admin.id \
#     --from-file=appUser.id=./piishield-bridge/wallet/appUser.id
#
# The manifest below is left as a placeholder structure to show what
# the Secret's shape looks like; do not apply this file directly with
# real key material inlined.

apiVersion: v1
kind: Secret
metadata:
  name: piishield-fabric-wallet
  namespace: piishield
type: Opaque
stringData:
  connection-org1.json: "REPLACE_WITH_ACTUAL_CONNECTION_PROFILE_CONTENTS"
  admin.id: "REPLACE_WITH_ACTUAL_WALLET_ADMIN_IDENTITY"
  appUser.id: "REPLACE_WITH_ACTUAL_WALLET_APPUSER_IDENTITY"
